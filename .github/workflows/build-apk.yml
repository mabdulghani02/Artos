name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Kode Repositori
        uses: actions/checkout@v4

      - name: Pasang Lingkungan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Pasang Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Pasang Dependensi Proyek
        run: |
          npm install

      - name: Inisialisasi Platform Android
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Berikan Izin Eksekusi Gradle
        run: |
          chmod +x android/gradlew

      - name: Kompilasi APK Android Debug
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Unggah Berkas APK Jadi
        uses: actions/upload-artifact@v4
        with:
          name: Artos-App
          path: android/app/build/outputs/apk/debug/app-debug.apk
