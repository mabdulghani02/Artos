name: Build Android APK (Capacitor)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Periksa Kode Sumber
        uses: actions/checkout@v4

      - name: Siapkan Lingkungan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Siapkan Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Siapkan Berkas Web Artos
        run: |
          mkdir -p dist
          cp -r index.html css js dist/ 2>/dev/null || cp index.html dist/
          [ -d "css" ] && cp -r css dist/ || true
          [ -d "js" ] && cp -r js dist/ || true

      - name: Pasang Modul dan Inisialisasi Android
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init Artos com.artos.finance --web-dir dist
          npx cap add android
          npx cap sync android

      - name: Tulis Modul Java KWGT dan MainActivity
        run: |
          mkdir -p android/app/src/main/java/com/artos/finance

          cat << 'EOF' > android/app/src/main/java/com/artos/finance/KWGTBridge.java
          package com.artos.finance;

          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.webkit.JavascriptInterface;

          public class KWGTBridge extends BroadcastReceiver {
              private Context context;

              public KWGTBridge() {}

              public KWGTBridge(Context ctx) {
                  this.context = ctx;
              }

              @JavascriptInterface
              public void kirimSemuaKeKWGT(String tunai, String gopay, String mandiri, String limit) {
                  kirimVar("tunai", tunai);
                  kirimVar("gopay", gopay);
                  kirimVar("mandiri", mandiri);
                  kirimVar("limit", limit);

                  SharedPreferences pref = context.getSharedPreferences("ArtosKWGT", Context.MODE_PRIVATE);
                  pref.edit()
                      .putString("tunai", tunai)
                      .putString("gopay", gopay)
                      .putString("mandiri", mandiri)
                      .putString("limit", limit)
                      .apply();
              }

              private void kirimVar(String nama, String nilai) {
                  Intent intent = new Intent("org.kustom.action.SEND_VAR");
                  intent.putExtra("org.kustom.action.EXT_NAME", "artos");
                  intent.putExtra("org.kustom.action.VAR_NAME", nama);
                  intent.putExtra("org.kustom.action.VAR_VALUE", nilai);
                  if (context != null) {
                      context.sendBroadcast(intent);
                  }
              }

              @Override
              public void onReceive(Context ctx, Intent intent) {
                  if ("com.artos.finance.POTONG_SALDO".equals(intent.getAction())) {
                      // Baca nominal baik berupa String maupun Long/Int
                      long potongan = 0;
                      String nomStr = intent.getStringExtra("nominal");
                      if (nomStr != null && !nomStr.isEmpty()) {
                          try {
                              potongan = Long.parseLong(nomStr.trim());
                          } catch (Exception ignored) {}
                      }
                      if (potongan == 0) {
                          potongan = intent.getLongExtra("nominal", 0);
                      }

                      String sumber = intent.getStringExtra("sumber");
                      if (sumber == null || sumber.isEmpty()) {
                          sumber = "tunai";
                      }
                      sumber = sumber.trim().toLowerCase();

                      if (potongan > 0) {
                          SharedPreferences pref = ctx.getSharedPreferences("ArtosKWGT", Context.MODE_PRIVATE);
                          long saldoDompet = Long.parseLong(pref.getString(sumber, "0"));
                          long limit = Long.parseLong(pref.getString("limit", "50000"));

                          long sisaSaldo = Math.max(0, saldoDompet - potongan);
                          long sisaLimit = Math.max(0, limit - potongan);

                          pref.edit()
                              .putString(sumber, String.valueOf(sisaSaldo))
                              .putString("limit", String.valueOf(sisaLimit))
                              .apply();

                          // Pancarkan saldo dompet terbaru ke KWGT
                          Intent bSaldo = new Intent("org.kustom.action.SEND_VAR");
                          bSaldo.putExtra("org.kustom.action.EXT_NAME", "artos");
                          bSaldo.putExtra("org.kustom.action.VAR_NAME", sumber);
                          bSaldo.putExtra("org.kustom.action.VAR_VALUE", String.valueOf(sisaSaldo));
                          ctx.sendBroadcast(bSaldo);

                          // Pancarkan limit terbaru ke KWGT
                          Intent bLimit = new Intent("org.kustom.action.SEND_VAR");
                          bLimit.putExtra("org.kustom.action.EXT_NAME", "artos");
                          bLimit.putExtra("org.kustom.action.VAR_NAME", "limit");
                          bLimit.putExtra("org.kustom.action.VAR_VALUE", String.valueOf(sisaLimit));
                          ctx.sendBroadcast(bLimit);

                          // Jika aplikasi sedang aktif, jalankan pemotongan pada WebView
                          if (MainActivity.instance != null) {
                              final long fPotongan = potongan;
                              final String fSumber = sumber;
                              final String fKategori = intent.getStringExtra("kategori") != null ? intent.getStringExtra("kategori") : "Widget";
                              MainActivity.instance.runOnUiThread(new Runnable() {
                                  @Override
                                  public void run() {
                                      MainActivity.instance.eksekusiPotongJS(fPotongan, fSumber, fKategori);
                                  }
                              });
                          }
                      }
                  }
              }
          }
          EOF

          cat << 'EOF' > android/app/src/main/java/com/artos/finance/MainActivity.java
          package com.artos.finance;

          import android.content.Context;
          import android.content.SharedPreferences;
          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              public static MainActivity instance;

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  instance = this;
              }

              @Override
              public void onResume() {
                  super.onResume();
                  instance = this;
                  if (this.bridge != null && this.bridge.getWebView() != null) {
                      this.bridge.getWebView().addJavascriptInterface(new KWGTBridge(this), "KWGTBridge");
                  }
              }

              public void eksekusiPotongJS(long nominal, String sumber, String kategori) {
                  if (this.bridge != null && this.bridge.getWebView() != null) {
                      String js = String.format("if(typeof window.potongDariKWGT === 'function'){ window.potongDariKWGT(%d, '%s', '%s'); }", nominal, sumber, kategori);
                      this.bridge.getWebView().evaluateJavascript(js, null);
                  }
              }
          }
          EOF

      - name: Daftarkan Receiver ke AndroidManifest
        run: |
          sed -i '/<\/application>/i \        <receiver android:name=".KWGTBridge" android:exported="true"><intent-filter><action android:name="com.artos.finance.POTONG_SALDO" /></intent-filter></receiver>' android/app/src/main/AndroidManifest.xml

      - name: Kompilasi APK dengan Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Unggah Artefak APK Siap Unduh
        uses: actions/upload-artifact@v4
        with:
          name: Artos-Finansial-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
