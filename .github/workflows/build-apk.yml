name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Kode
        uses: actions/checkout@v4

      - name: Pasang Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Pasang Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Pasang Dependensi Capacitor
        run: |
          npm install
          npx cap add android

      - name: Sinkronisasi Aset Web
        run: |
          npx cap sync android

      - name: Rakit APK Android (Debug)
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Unggah Berkas APK
        uses: actions/upload-artifact@v4
        with:
          name: Artos-App
          path: android/app/build/outputs/apk/debug/app-debug.apk
