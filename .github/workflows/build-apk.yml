name: Build Android APK (Capacitor)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Periksa Kode Sumber
        uses: actions/checkout@v4

      - name: Siapkan Lingkungan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Siapkan Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Siapkan Berkas Web Artos
        run: |
          mkdir -p dist
          cp -r index.html css js dist/ 2>/dev/null || cp index.html dist/
          [ -d "css" ] && cp -r css dist/ || true
          [ -d "js" ] && cp -r js dist/ || true

      - name: Pasang Modul dan Inisialisasi Android
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init Artos com.artos.finance --web-dir dist
          npx cap add android
          npx cap sync android

      - name: Pasang Jembatan Penuh Dua Arah KWGT
        run: |
          mkdir -p android/app/src/main/java/com/artos/finance

          # 1. Java: Jembatan Javascript ke KWGT dan Sebaliknya
          cat << 'EOF' > android/app/src/main/java/com/artos/finance/KWGTBridge.java
          package com.artos.finance;

          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.webkit.JavascriptInterface;
          import com.getcapacitor.BridgeActivity;

          public class KWGTBridge extends BroadcastReceiver {
              private Context context;
              private BridgeActivity activity;

              public KWGTBridge() {}

              public KWGTBridge(BridgeActivity act) {
                  this.activity = act;
                  this.context = act.getApplicationContext();
              }

              // Kirim data saldo dari Artos ke KWGT
              @JavascriptInterface
              public void kirimSemuaKeKWGT(String tunai, String gopay, String mandiri, String limit) {
                  kirimVar("tunai", tunai);
                  kirimVar("gopay", gopay);
                  kirimVar("mandiri", mandiri);
                  kirimVar("limit", limit);

                  SharedPreferences pref = context.getSharedPreferences("ArtosKWGT", Context.MODE_PRIVATE);
                  pref.edit()
                      .putString("tunai", tunai)
                      .putString("gopay", gopay)
                      .putString("mandiri", mandiri)
                      .putString("limit", limit)
                      .apply();
              }

              private void kirimVar(String nama, String nilai) {
                  Intent intent = new Intent("org.kustom.action.SEND_VAR");
                  intent.putExtra("org.kustom.action.EXT_NAME", "artos");
                  intent.putExtra("org.kustom.action.VAR_NAME", nama);
                  intent.putExtra("org.kustom.action.VAR_VALUE", nilai);
                  context.sendBroadcast(intent);
              }

              // Terima perintah potong saldo langsung dari ketukan tombol KWGT
              @Override
              public void onReceive(Context ctx, Intent intent) {
                  if ("com.artos.finance.POTONG_SALDO".equals(intent.getAction())) {
                      long potongan = intent.getLongExtra("nominal", 0);
                      if (potongan > 0) {
                          SharedPreferences pref = ctx.getSharedPreferences("ArtosKWGT", Context.MODE_PRIVATE);
                          long tunai = Long.parseLong(pref.getString("tunai", "0"));
                          long limit = Long.parseLong(pref.getString("limit", "50000"));

                          long sisaTunai = Math.max(0, tunai - potongan);
                          long sisaLimit = Math.max(0, limit - potongan);

                          pref.edit()
                              .putString("tunai", String.valueOf(sisaTunai))
                              .putString("limit", String.valueOf(sisaLimit))
                              .apply();

                          // Siarkan balik nilai baru ke KWGT seketika
                          Intent bTunai = new Intent("org.kustom.action.SEND_VAR");
                          bTunai.putExtra("org.kustom.action.EXT_NAME", "artos");
                          bTunai.putExtra("org.kustom.action.VAR_NAME", "tunai");
                          bTunai.putExtra("org.kustom.action.VAR_VALUE", String.valueOf(sisaTunai));
                          ctx.sendBroadcast(bTunai);

                          Intent bLimit = new Intent("org.kustom.action.SEND_VAR");
                          bLimit.putExtra("org.kustom.action.EXT_NAME", "artos");
                          bLimit.putExtra("org.kustom.action.VAR_NAME", "limit");
                          bLimit.putExtra("org.kustom.action.VAR_VALUE", String.valueOf(sisaLimit));
                          ctx.sendBroadcast(bLimit);
                      }
                  }
              }
          }
          EOF

          # 2. Daftarkan Receiver Siaran di AndroidManifest.xml
          python3 -c '
          path = "android/app/src/main/AndroidManifest.xml"
          with open(path, "r") as f:
              content = f.read()
          receiver = """
                  <receiver android:name=".KWGTBridge" android:exported="true">
                      <intent-filter>
                          <action android:name="com.artos.finance.POTONG_SALDO" />
                      </intent-filter>
                  </receiver>
              </application>"""
          content = content.replace("</application>", receiver)
          with open(path, "w") as f:
              f.write(content)
          '

          # 3. Suntikkan Pengait Web Interface ke MainActivity.java
          python3 -c '
          path = "android/app/src/main/java/com/artos/finance/MainActivity.java"
          with open(path, "r") as f:
              code = f.read()
          inject = """
              @Override
              public void onResume() {
                  super.onResume();
                  this.bridge.getWebView().addJavascriptInterface(new KWGTBridge(this), "KWGTBridge");
                  this.bridge.getWebView().evaluateJavascript(
                      "(function(){ if(window.bacaData){" +
                      "  var s = bacaData(\x27artos_saldo\x27, {tunai:0,gopay:0,mandiri:0});" +
                      "  var l = (typeof batasHarianDinamis !== \x27undefined\x27) ? batasHarianDinamis : 50000;" +
                      "  if(window.KWGTBridge) window.KWGTBridge.kirimSemuaKeKWGT(String(s.tunai||0), String(s.gopay||0), String(s.mandiri||0), String(l));" +
                      "}})();", null
                  );
              }
          """
          code = code.replace("public class MainActivity extends BridgeActivity {", "public class MainActivity extends BridgeActivity {\n" + inject)
          with open(path, "w") as f:
              f.write(code)
          '

      - name: Kompilasi APK dengan Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Unggah Artefak APK Siap Unduh
        uses: actions/upload-artifact@v4
        with:
          name: Artos-Finansial-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
              android:layout_weight="1"
                      android:layout_marginEnd="4dp"
                      android:text="+50 Ribu"
                      android:textColor="#ffffff"
                      android:background="@drawable/btn_pecahan_bg"
                      android:textSize="11sp" />
                  <Button
                      android:id="@+id/btn20k"
                      android:layout_width="0dp"
                      android:layout_height="44dp"
                      android:layout_weight="1"
                      android:layout_marginEnd="4dp"
                      android:text="+20 Ribu"
                      android:textColor="#ffffff"
                      android:background="@drawable/btn_pecahan_bg"
                      android:textSize="11sp" />
              </LinearLayout>

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="horizontal"
                  android:weightSum="4"
                  android:layout_marginBottom="16dp">
                  <Button
                      android:id="@+id/btn10k"
                      android:layout_width="0dp"
                      android:layout_height="44dp"
                      android:layout_weight="1"
                      android:layout_marginEnd="3dp"
                      android:text="+10 Ribu"
                      android:textColor="#ffffff"
                      android:background="@drawable/btn_pecahan_bg"
                      android:textSize="10sp" />
                  <Button
                      android:id="@+id/btn5k"
                      android:layout_width="0dp"
                      android:layout_height="44dp"
                      android:layout_weight="1"
                      android:layout_marginEnd="3dp"
                      android:text="+5 Ribu"
                      android:textColor="#ffffff"
                      android:background="@drawable/btn_pecahan_bg"
                      android:textSize="10sp" />
                  <Button
                      android:id="@+id/btn2k"
                      android:layout_width="0dp"
                      android:layout_height="44dp"
                      android:layout_weight="1"
                      android:layout_marginEnd="3dp"
                      android:text="+2 Ribu"
                      android:textColor="#ffffff"
                      android:background="@drawable/btn_pecahan_bg"
                      android:textSize="10sp" />
                  <Button
                      android:id="@+id/btn1k"
                      android:layout_width="0dp"
                      android:layout_height="44dp"
                      android:layout_weight="1"
                      android:layout_marginEnd="3dp"
                      android:text="+1 Ribu"
                      android:textColor="#ffffff"
                      android:background="@drawable/btn_pecahan_bg"
                      android:textSize="10sp" />
              </LinearLayout>

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="horizontal">
                  <Button
                      android:id="@+id/btnResetHitungan"
                      android:layout_width="0dp"
                      android:layout_height="44dp"
                      android:layout_weight="1"
                      android:layout_marginEnd="8dp"
                      android:text="Ulangi"
                      android:textColor="#ef4444"
                      android:background="@drawable/btn_pecahan_bg"
                      android:textSize="12sp" />
                  <Button
                      android:id="@+id/btnKonfirmasiPotong"
                      android:layout_width="0dp"
                      android:layout_height="44dp"
                      android:layout_weight="2"
                      android:text="Simpan"
                      android:textColor="#ffffff"
                      android:background="@drawable/btn_pecahan_bg"
                      android:textStyle="bold"
                      android:textSize="12sp" />
              </LinearLayout>
          </LinearLayout>
          EOF

          cat << 'EOF' > android/app/src/main/java/com/artos/finance/QuickInputActivity.java
          package com.artos.finance;

          import android.app.Activity;
          import android.appwidget.AppWidgetManager;
          import android.content.ComponentName;
          import android.content.Context;
          import android.content.SharedPreferences;
          import android.os.Bundle;
          import android.widget.Button;
          import android.widget.TextView;
          import java.text.NumberFormat;
          import java.util.Locale;

          public class QuickInputActivity extends Activity {
              private long totalAkumulasi = 0;
              private TextView tvTotal;
              private NumberFormat fmt;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.dialog_quick_input);

                  fmt = NumberFormat.getNumberInstance(new Locale("id", "ID"));
                  tvTotal = findViewById(R.id.tvTotalAkumulasi);

                  findViewById(R.id.btn100k).setOnClickListener(v -> tambahNominal(100000));
                  findViewById(R.id.btn50k).setOnClickListener(v -> tambahNominal(50000));
                  findViewById(R.id.btn20k).setOnClickListener(v -> tambahNominal(20000));
                  findViewById(R.id.btn10k).setOnClickListener(v -> tambahNominal(10000));
                  findViewById(R.id.btn5k).setOnClickListener(v -> tambahNominal(5000));
                  findViewById(R.id.btn2k).setOnClickListener(v -> tambahNominal(2000));
                  findViewById(R.id.btn1k).setOnClickListener(v -> tambahNominal(1000));

                  findViewById(R.id.btnResetHitungan).setOnClickListener(v -> {
                      totalAkumulasi = 0;
                      perbaruiTampilan();
                  });

                  findViewById(R.id.btnKonfirmasiPotong).setOnClickListener(v -> {
                      if (totalAkumulasi > 0) {
                          SharedPreferences pref = getSharedPreferences("ArtosWidgetData", Context.MODE_PRIVATE);
                          long tunai = pref.getLong("saldo_tunai", 0);
                          long limit = pref.getLong("sisa_limit", 50000);

                          pref.edit()
                              .putLong("saldo_tunai", Math.max(0, tunai - totalAkumulasi))
                              .putLong("sisa_limit", Math.max(0, limit - totalAkumulasi))
                              .apply();

                          AppWidgetManager mgr = AppWidgetManager.getInstance(this);
                          ComponentName cn = new ComponentName(this, ArtosWidgetProvider.class);
                          int[] ids = mgr.getAppWidgetIds(cn);
                          ArtosWidgetProvider.perbaruiSemuaWidget(this, mgr, ids);
                      }
                      finish();
                  });
              }

              private void tambahNominal(long nilai) {
                  totalAkumulasi += nilai;
                  perbaruiTampilan();
              }

              private void perbaruiTampilan() {
                  tvTotal.setText("Rp " + fmt.format(totalAkumulasi));
              }
          }
          EOF

          cat << 'EOF' > android/app/src/main/java/com/artos/finance/ArtosWidgetProvider.java
          package com.artos.finance;

          import android.app.PendingIntent;
          import android.appwidget.AppWidgetManager;
          import android.appwidget.AppWidgetProvider;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.widget.RemoteViews;
          import java.text.NumberFormat;
          import java.util.Locale;

          public class ArtosWidgetProvider extends AppWidgetProvider {

              @Override
              public void onUpdate(Context context, AppWidgetManager appWidgetManager, int[] appWidgetIds) {
                  perbaruiSemuaWidget(context, appWidgetManager, appWidgetIds);
              }

              public static void perbaruiSemuaWidget(Context context, AppWidgetManager mgr, int[] appWidgetIds) {
                  SharedPreferences pref = context.getSharedPreferences("ArtosWidgetData", Context.MODE_PRIVATE);
                  long tunai = pref.getLong("saldo_tunai", 0);
                  long gopay = pref.getLong("saldo_gopay", 0);
                  long mandiri = pref.getLong("saldo_mandiri", 0);
                  long limit = pref.getLong("sisa_limit", 50000);

                  NumberFormat fmt = NumberFormat.getNumberInstance(new Locale("id", "ID"));

                  for (int id : appWidgetIds) {
                      RemoteViews views = new RemoteViews(context.getPackageName(), R.layout.widget_artos);
                      views.setTextViewText(R.id.tvWidgetTunai, "Rp " + fmt.format(tunai));
                      views.setTextViewText(R.id.tvWidgetGopay, "Rp " + fmt.format(gopay));
                      views.setTextViewText(R.id.tvWidgetMandiri, "Rp " + fmt.format(mandiri));
                      views.setTextViewText(R.id.tvWidgetSisaLimit, "Limit: Rp " + fmt.format(limit));

                      Intent intent = new Intent(context, QuickInputActivity.class);
                      intent.setFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      PendingIntent pendingIntent = PendingIntent.getActivity(
                          context, id, intent, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE
                      );
                      views.setOnClickPendingIntent(R.id.btnBukaPopupInput, pendingIntent);

                      mgr.updateAppWidget(id, views);
                  }
              }
          }
          EOF

          python3 -c '
          path = "android/app/src/main/AndroidManifest.xml"
          with open(path, "r") as f:
              content = f.read()
          manifest_entry = """
                  <activity 
                      android:name=".QuickInputActivity" 
                      android:theme="@android:style/Theme.Dialog" 
                      android:exported="true" />

                  <receiver android:name=".ArtosWidgetProvider" android:exported="true">
                      <intent-filter>
                          <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
                      </intent-filter>
                      <meta-data
                          android:name="android.appwidget.provider"
                          android:resource="@xml/artos_widget_info" />
                  </receiver>
              </application>"""
          content = content.replace("</application>", manifest_entry)
          with open(path, "w") as f:
              f.write(content)
          '

      - name: Kompilasi APK dengan Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Unggah Artefak APK Siap Unduh
        uses: actions/upload-artifact@v4
        with:
          name: Artos-Finansial-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
