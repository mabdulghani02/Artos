name: Build Android APK (Capacitor)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Periksa Kode Sumber
        uses: actions/checkout@v4

      - name: Siapkan Lingkungan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Siapkan Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Siapkan Berkas Web Artos
        run: |
          mkdir -p dist
          cp -r index.html css js dist/ 2>/dev/null || cp index.html dist/
          [ -d "css" ] && cp -r css dist/ || true
          [ -d "js" ] && cp -r js dist/ || true

      - name: Pasang Modul dan Inisialisasi Android
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init Artos com.artos.finance --web-dir dist
          npx cap add android
          npx cap sync android

      - name: Tulis Modul MainActivity untuk Deep Link
        run: |
          cat << 'EOF' > android/app/src/main/java/com/artos/finance/MainActivity.java
          package com.artos.finance;

          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  tanganiIntent(getIntent());
              }

              @Override
              protected void onNewIntent(Intent intent) {
                  super.onNewIntent(intent);
                  setIntent(intent);
                  tanganiIntent(intent);
              }

              private void tanganiIntent(Intent intent) {
                  if (intent != null && Intent.ACTION_VIEW.equals(intent.getAction())) {
                      Uri data = intent.getData();
                      if (data != null && "artos".equals(data.getScheme()) && "potong".equals(data.getHost())) {
                          String nominal = data.getQueryParameter("nominal");
                          String sumber = data.getQueryParameter("sumber");
                          String kategori = data.getQueryParameter("kategori");

                          final String fNom = (nominal != null) ? nominal : "0";
                          final String fSum = (sumber != null) ? sumber : "tunai";
                          final String fKat = (kategori != null) ? kategori : "Widget";

                          if (this.bridge != null && this.bridge.getWebView() != null) {
                              this.bridge.getWebView().post(new Runnable() {
                                  @Override
                                  public void run() {
                                      String js = String.format("if(typeof window.potongDariKWGT === 'function'){ window.potongDariKWGT('%s', '%s', '%s'); }", fNom, fSum, fKat);
                                      MainActivity.this.bridge.getWebView().evaluateJavascript(js, null);
                                  }
                              });
                          }
                      }
                  }
              }
          }
          EOF

      - name: Daftarkan Skema artos:// ke AndroidManifest
        run: |
          sed -i '/<category android:name="android.intent.category.LAUNCHER" \/>/a \                <action android:name="android.intent.action.VIEW" \/>\n                <category android:name="android.intent.category.DEFAULT" \/>\n                <category android:name="android.intent.category.BROWSABLE" \/>\n                <data android:scheme="artos" android:host="potong" \/>' android/app/src/main/AndroidManifest.xml

      - name: Kompilasi APK dengan Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Unggah Artefak APK Siap Unduh
        uses: actions/upload-artifact@v4
        with:
          name: Artos-Finansial-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
