      - name: Pasang Capacitor dan Rakit Komponen Widget
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init Artos com.artos.finance --web-dir .
          npx cap add android
          npx cap sync android

          # Menyalin aset widget otomatis ke dalam proyek Android
          mkdir -p android/app/src/main/res/layout
          mkdir -p android/app/src/main/res/xml
          mkdir -p android/app/src/main/java/com/artos/finance

          cp android-widget/widget_artos.xml android/app/src/main/res/layout/
          cp android-widget/ArtosWidgetProvider.java android/app/src/main/java/com/artos/finance/

          # Daftarkan konfigurasi widget ke AndroidManifest
          sed -i '/<\/application>/i <receiver android:name=".ArtosWidgetProvider" android:exported="true"><intent-filter><action android:name="android.appwidget.action.APPWIDGET_UPDATE" /></intent-filter><meta-data android:name="android.appwidget.provider" android:resource="@xml/artos_widget_info" /></receiver>' android/app/src/main/AndroidManifest.xml
          
          # Buat file metadata widget
          cat << 'EOF' > android/app/src/main/res/xml/artos_widget_info.xml
          <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"
              android:minWidth="280dp"
              android:minHeight="110dp"
              android:updatePeriodMillis="1800000"
              android:initialLayout="@layout/widget_artos"
              android:resizeMode="horizontal|vertical"
              android:widgetCategory="home_screen" />
          EOF
