name: Build Android APK (Capacitor)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Periksa Kode Sumber
        uses: actions/checkout@v4

      - name: Siapkan Lingkungan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Siapkan Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Siapkan Berkas Web Artos
        run: |
          mkdir -p dist
          cp -r index.html css js dist/ 2>/dev/null || cp index.html dist/
          [ -d "css" ] && cp -r css dist/ || true
          [ -d "js" ] && cp -r js dist/ || true

      - name: Pasang Modul dan Inisialisasi Android
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init Artos com.artos.finance --web-dir dist
          npx cap add android
          npx cap sync android

      - name: Kompilasi APK dengan Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Unggah Artefak APK
        uses: actions/upload-artifact@v4
        with:
          name: Artos-Finansial-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
