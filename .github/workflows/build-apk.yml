name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Kode Repositori
        uses: actions/checkout@v4

      - name: Pasang Lingkungan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Pasang Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Siapkan Folder Distribusi Web (www)
        run: |
          mkdir -p www
          cp index.html www/
          cp -r css www/
          cp -r js www/

      - name: Pasang Dependensi Capacitor
        run: |
          npm install

      - name: Inisialisasi Platform Android
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Pasang Izin Akses Internet Android
        run: |
          sed -i '/<application/i <uses-permission android:name="android.permission.INTERNET" />\n<uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />' android/app/src/main/AndroidManifest.xml

      - name: Berikan Izin Eksekusi Gradle
        run: |
          chmod +x android/gradlew

      - name: Kompilasi APK Android Debug
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Unggah Berkas APK Jadi
        uses: actions/upload-artifact@v4
        with:
          name: Artos-App
          path: android/app/build/outputs/apk/debug/app-debug.apk
